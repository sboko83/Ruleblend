name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rehearse (assets are uploaded as an artifact, nothing is published)
        required: true

permissions:
  contents: read

env:
  # A pushed tag publishes a release; a manual run rehearses one under the tag it names.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            gradlew: ./gradlew
            format: dmg
          - os: windows-latest
            gradlew: ./gradlew.bat
            format: msi
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The daemon runs on 21; Kotlin/JVM and test workers use the 17 toolchain.
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: python -B tools/release_assets.py validate-tag --tag "$RELEASE_TAG"

      - name: Runner contracts
        run: python -B -m unittest discover -s tools -p test_ui_e2e.py

      - name: MCP guide contract
        run: python -B tools/mcp_contract.py

      - name: Publication audit contracts
        run: python -B -m unittest discover -s tools -p test_check_public_tree.py

      - name: Release asset contracts
        run: python -B -m unittest discover -s tools -p test_release_assets.py

      - name: Test
        # Every module, not just core: the MCP protocol facade, the install state and the Compose
        # screens all carry regression tests, and a green run must mean they passed too.
        # Warnings fail the build here: they name code a future Kotlin will refuse to compile.
        run: ${{ matrix.gradlew }} -PwarningsAsErrors=true :core:allTests :mcp:allTests :app:allTests :app:compileUiE2eKotlinJvm

      - name: Third-party license coverage
        run: |
          python -B -m unittest discover -s tools -p test_check_licenses.py
          ${{ matrix.gradlew }} :app:writeRuntimeDependencyManifest
          python -B tools/check_licenses.py app/build/reports/runtime-dependencies.txt

      - name: Package
        # Unsigned: no signing config exists, and this only checks that the distribution builds.
        run: ${{ matrix.gradlew }} :app:packageDistributionForCurrentOS

      - name: Packaged license notices
        shell: bash
        run: |
          image=app/build/compose/binaries/main/app/Ruleblend
          if [ "$RUNNER_OS" = macOS ]; then image="$image.app"; fi
          python -B tools/check_licenses.py app/build/reports/runtime-dependencies.txt --image "$image"

      - name: Packaged Windows MCP
        if: runner.os == 'Windows'
        run: python tools/mcp_smoke.py app/build/compose/binaries/main/app/Ruleblend

      - name: Upload distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ruleblend-${{ matrix.format }}
          path: app/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}
          if-no-files-found: error

      - name: Release assets
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          dir=app/build/compose/binaries/main
          image=$dir/app/Ruleblend
          if [ "$RUNNER_OS" = macOS ]; then image="$image.app"; fi
          installers=("$dir"/${{ matrix.format }}/*.${{ matrix.format }})
          [ ${#installers[@]} -eq 1 ] || { echo "Expected one installer, found ${#installers[@]}"; exit 1; }
          python -B tools/release_assets.py collect --tag "$RELEASE_TAG" --image "$image" \
            --installer "${installers[0]}" --output build/release-assets

      - name: Upload release assets
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.format }}
          path: build/release-assets/
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            core/build/reports/tests/
            mcp/build/reports/tests/
            app/build/reports/tests/

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release-assets
          merge-multiple: true

      - name: Verify assets and write checksums
        run: python -B tools/release_assets.py verify --tag "$RELEASE_TAG" --output build/release-assets

      - name: Upload rehearsal
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: build/release-assets/
          if-no-files-found: error

      - name: Draft release
        # A draft: installers and notes are reviewed on GitHub before the release is published.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" build/release-assets/* --draft --prerelease \
            --verify-tag --title "Ruleblend $RELEASE_TAG" \
            --notes "Unsigned alpha build. Installation steps: https://github.com/${{ github.repository }}#unsigned-alpha-installation"
